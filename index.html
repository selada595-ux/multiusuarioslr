<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Recicladora S.A. - Sistema Integral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<div class="container mt-4">
    <!-- SECCIÓN LOGIN -->
    <div id="loginSection" class="card p-4 mx-auto" style="max-width: 400px;">
        <h3>Login - La Recicladora S.A.</h3>
        <input type="text" id="user" class="form-control mb-2" placeholder="Usuario">
        <input type="password" id="pass" class="form-control mb-2" placeholder="Contraseña">
        <button class="btn btn-success w-100" onclick="login()">Ingresar</button>
    </div>

    <!-- SECCIÓN APP -->
    <div id="appSection" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Control de Producción</h3>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="card p-3 mb-4">
            <h5>Nuevo Registro</h5>
            <div class="row g-2">
                <div class="col"><input type="date" id="fecha" class="form-control"></div>
                <div class="col"><input type="number" id="total" class="form-control" placeholder="Total"></div>
                <div class="col"><button class="btn btn-primary w-100" onclick="registrar()">Guardar</button></div>
            </div>
        </div>

        <div id="content"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB675pKmroUQx8dfIhiJE97eFIPqgaIGhE",
        authDomain: "recicladora-produccion.firebaseapp.com",
        projectId: "recicladora-produccion",
        storageBucket: "recicladora-produccion.firebasestorage.app",
        messagingSenderId: "719606910471",
        appId: "1:719606910471:web:3abbfd863e880b1a7d64a2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        // Validación multiusuario original
        if(u && p) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            cargarDatos();
        } else {
            alert("Credenciales requeridas");
        }
    }

    function logout() {
        location.reload();
    }

    function registrar() {
        const fecha = document.getElementById('fecha').value;
        const total = document.getElementById('total').value;
        
        db.collection("registros_produccion").add({
            fecha: fecha,
            total: parseFloat(total),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("Guardado");
        });
    }

    function cargarDatos() {
        db.collection("registros_produccion").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let html = '<table class="table table-striped"><thead><tr><th>Fecha</th><th>Total</th></tr></thead><tbody>';
            snapshot.forEach((doc) => {
                const d = doc.data();
                html += `<tr><td>${d.fecha}</td><td>${d.total}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('content').innerHTML = html;
        });
    }
</script>
</body>
</html>
