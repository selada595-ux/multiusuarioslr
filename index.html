<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Recicladora S.A. - Control de Producción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<div id="app" class="container mt-5">
    <h1>Sistema de Control - La Recicladora S.A.</h1>
    <div id="content"></div>
</div>

<script>
    // Configuración original de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyB675pKmroUQx8dfIhiJE97eFIPqgaIGhE",
        authDomain: "recicladora-produccion.firebaseapp.com",
        projectId: "recicladora-produccion",
        storageBucket: "recicladora-produccion.firebasestorage.app",
        messagingSenderId: "719606910471",
        appId: "1:719606910471:web:3abbfd863e880b1a7d64a2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Lógica original de carga de datos
    db.collection("registros_produccion").get().then((querySnapshot) => {
        let html = '<table class="table"><thead><tr><th>Fecha</th><th>Total</th></tr></thead><tbody>';
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            html += `<tr><td>${data.fecha || 'N/A'}</td><td>${data.total || 0}</td></tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('content').innerHTML = html;
    }).catch((error) => {
        console.error("Error al recuperar datos: ", error);
    });
</script>

</body>
</html>
