<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Recicladora S.A. - Módulo de Producción</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #1b4d3e;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 12px;
            background-color: #1b4d3e;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #14382c;
        }
        .section {
            display: none;
        }
        .active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #1b4d3e;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>La Recicladora S.A.</h2>
    <p style="text-align: center; color: #666;">Módulo de Producción y Maestros</p>
    
    <!-- VISTA 1: LOGIN -->
    <div id="vistaLogin" class="section active">
        <h3>Logon de Usuario</h3>
        <div class="form-group">
            <label for="usuario">Usuario:</label>
            <select id="usuario">
                <option value="RECI 1">RECI 1</option>
                <option value="RECI 2">RECI 2</option>
                <option value="RECI 3">RECI 3</option>
                <option value="RECI 4">RECI 4</option>
                <option value="RECI 5">RECI 5</option>
                <option value="RECI 6">RECI 6</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Ingrese su contraseña">
        </div>

        <button onclick="handleLogin()">Ingresar</button>
    </div>

    <!-- VISTA 2: PANEL PRINCIPAL Y MÓDULO MAESTRO -->
    <div id="vistaPrincipal" class="section">
        <h3 id="saludoUsuario"></h3>
        
        <hr style="margin: 20px 0;">

        <h3>Gestión de Catálogos (Maestros)</h3>
        <div class="form-group">
            <label for="tipoMaestro">Seleccionar Catálogo:</label>
            <select id="tipoMaestro" onchange="cambiarMaestro()">
                <option value="operarios">Operarios</option>
                <option value="trabajos">Trabajos</option>
                <option value="materiales">Materiales</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nuevoValor">Nuevo Elemento:</label>
            <input type="text" id="nuevoValor" placeholder="Ej. Juan Pérez, Corte, Aluminio...">
        </div>
        <button onclick="agregarMaestro()">Agregar a Maestro</button>

        <h4>Elementos Registrados:</h4>
        <table>
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </i>
            <tbody id="tablaMaestrosBody">
                <!-- Se llenará dinámicamente -->
            </tbody>
        </table>

        <button class="btn-secondary" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</div>

<script>
    // Estructura de datos local para los maestros
    let catalogos = {
        operarios: ["Operario 1", "Operario 2"],
        trabajos: ["Clasificación", "Compactado"],
        materiales: ["Cartón", "Plástico PET", "Aluminio"]
    };

    function handleLogin() {
        const user = document.getElementById('usuario').value;
        const pass = document.getElementById('password').value;

        if(pass.trim() === "") {
            alert("Por favor ingrese la contraseña");
            return;
        }

        sessionStorage.setItem("usuarioActivo", user);
        
        // Cambiar de vista
        document.getElementById('vistaLogin').classList.remove('active');
        document.getElementById('vistaPrincipal').classList.add('active');
        document.getElementById('saludoUsuario').innerText = "Bienvenido, " + user;
        
        renderMaestros();
    }

    function cambiarMaestro() {
        renderMaestros();
    }

    function agregarMaestro() {
        const tipo = document.getElementById('tipoMaestro').value;
        const valor = document.getElementById('nuevoValor').value.trim();

        if(valor === "") {
            alert("El campo no puede estar vacío");
            return;
        }

        catalogos[tipo].push(valor);
        document.getElementById('nuevoValor').value = "";
        renderMaestros();
    }

    function eliminarMaestro(index) {
        const tipo = document.getElementById('tipoMaestro').value;
        catalogos[tipo].splice(index, 1);
        renderMaestros();
    }

    function renderMaestros() {
        const tipo = document.getElementById('tipoMaestro').value;
        const tbody = document.getElementById('tablaMaestrosBody');
        tbody.innerHTML = "";

        catalogos[tipo].forEach((item, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item}</td>
                <td><button style="background-color: #d9534f; padding: 6px; width: auto;" onclick="eliminarMaestro(${index})">Eliminar</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function cerrarSesion() {
        sessionStorage.removeItem("usuarioActivo");
        document.getElementById('vistaPrincipal').classList.remove('active');
        document.getElementById('vistaLogin').classList.add('active');
        document.getElementById('password').value = "";
    }
</script>

</body>
</html>
